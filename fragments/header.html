<style>
  header.header {
    --wb-bg: #fff;
    --wb-ground: #000;
    --wb-primary: #efd024;
    --wb-display: "Bebas Neue", system-ui, sans-serif;

    display: block;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  header.header .wb-eyebrow {
    background: var(--wb-primary);
    color: var(--wb-ground);
    font-family: var(--wb-display);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 10px 24px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  header.header .wb-eyebrow .pip {
    display: inline-flex;
    gap: 8px;
    align-items: center;
  }

  header.header .wb-eyebrow .pip::before {
    content: "";
    width: 8px;
    height: 8px;
    background: var(--wb-ground);
  }

  header.header .wb-bar {
    background: var(--wb-bg);
    border-bottom: 1px solid var(--wb-ground);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header.header .wb-wordmark {
    font-family: var(--wb-display);
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
    color: var(--wb-ground);
  }

  header.header .wb-wordmark .pip {
    background: var(--wb-ground);
    color: var(--wb-primary);
    padding: 2px 6px;
    margin-right: 6px;
  }

  header.header nav ul {
    display: flex;
    gap: 28px;
    list-style: none;
    margin: 0;
    padding: 0;
    font-family: var(--wb-display);
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  header.header nav a {
    display: inline-block;
    padding: 6px 0;
    border-bottom: 2px solid transparent;
    color: var(--wb-ground);
    text-decoration: none;
  }

  header.header nav a:hover,
  header.header nav a.active {
    border-bottom-color: var(--wb-primary);
  }

  /* mobile-menu via checkbox hack (fragment JS is inert) */
  header.header .wb-nav-toggle { display: none; }

  header.header .wb-hamburger {
    display: none;
    width: 32px;
    height: 18px;
    position: relative;
    cursor: pointer;
  }

  header.header .wb-hamburger span {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--wb-ground);
  }

  header.header .wb-hamburger span:nth-child(1) { top: 0; }
  header.header .wb-hamburger span:nth-child(2) { top: 8px; }
  header.header .wb-hamburger span:nth-child(3) { top: 16px; }

  @media (max-width: 760px) {
    header.header nav {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--wb-bg);
      border-bottom: 1px solid var(--wb-ground);
      padding: 20px 32px;
    }

    header.header nav ul {
      flex-direction: column;
      gap: 18px;
    }

    header.header .wb-hamburger { display: block; }

    header.header .wb-nav-toggle:checked ~ nav { display: block; }
  }
</style>
<div class="wb-eyebrow">
  <span class="pip">EST 1996 · WASATCH BACK BEERWORKS</span>
  <span>TWO TAPROOMS · HEBER VALLEY + PARK CITY</span>
</div>
<div class="wb-bar">
  <a href="/" class="wb-wordmark"><span class="pip">»</span>WASATCH BACK</a>
  <input type="checkbox" id="wb-nav-toggle" class="wb-nav-toggle" aria-hidden="true">
  <nav aria-label="Primary">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/beers">Beers</a></li>
      <li><a href="/the-brewery">The Brewery</a></li>
      <li><a href="/taprooms" class="active">Taprooms</a></li>
    </ul>
  </nav>
  <label for="wb-nav-toggle" class="wb-hamburger" aria-label="Menu"><span></span><span></span><span></span></label>
</div>
