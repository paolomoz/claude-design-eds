<style>
  /* Hirslanden header — lifted from the prototype <style>, scoped under .header.
     The host <header> gets class "header" (postlcp sets el.className), and the
     content is wrapped in <div class="header"> so the prototype's .header /
     .utility / .nav selectors match. Mobile nav uses a CSS checkbox-hack
     because fragment <script>/inline handlers are inert under EDS CSP. */
  header.header { position: sticky; top: 0; z-index: 50; }
  .header { background: #fff; border-bottom: 1px solid var(--color-border); }
  .header .wrap { max-width: var(--maxw, 1280px); margin: 0 auto; padding: 0 24px; }
  .header .utility { background: var(--color-surface); font-size: var(--fs-13); }
  .header .utility .wrap { display: flex; justify-content: flex-end; align-items: center; gap: 20px; padding: 8px 24px; color: var(--color-muted); }
  .header .utility a { color: var(--color-muted); font-size: var(--fs-13); }
  .header .utility .lang { color: var(--color-text); font-weight: 600; }
  .header .nav { padding: 14px 0; }
  .header .nav .wrap { display: flex; align-items: center; gap: 40px; }
  .header .logo { height: 38px; display: block; flex: none; }
  .header .logo img { height: 100%; width: auto; display: block; }
  .header .nav ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 32px; flex: 1; }
  .header .nav li a { color: var(--color-text); font-weight: 600; font-size: 15px; letter-spacing: .3px; }
  .header .nav li a:hover { color: var(--color-primary-deep); }
  .header .icon-search { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1.5px solid var(--color-border); color: var(--color-text); }
  .header .icon-search:hover { text-decoration: none; }

  /* CSS-only mobile nav toggle (replaces the prototype's inline-JS burger). */
  .header .nav-toggle { position: absolute; opacity: 0; pointer-events: none; }
  .header .ds-nav-burger { display: none; }
  @media (max-width: 820px) {
    .header .nav .wrap { flex-wrap: wrap; gap: 16px; }
    .header .nav ul { order: 3; width: 100%; gap: 18px; font-size: 14px; display: none; flex-direction: column; }
    .header .ds-nav-burger { display: inline-flex; margin-left: auto; width: 38px; height: 38px; align-items: center; justify-content: center; border-radius: 50%; border: 1.5px solid var(--color-border); background: #fff; cursor: pointer; font-size: 18px; }
    .header .nav-toggle:checked ~ .wrap ul { display: flex; }
  }
</style>
<div class="header">
  <div class="utility"><div class="wrap">
    <a href="/de/corporate/jobs-und-karriere">Jobs</a>
    <a href="/de/corporate/ueber-uns/kontakt">Kontakt</a>
    <a href="/de/corporate/medien-und-news">Medien</a>
    <a href="#" class="lang">DE</a><a href="/fr/corporate">FR</a><a href="/en/corporate">EN</a>
  </div></div>
  <nav class="nav" aria-label="Hauptnavigation">
    <input type="checkbox" id="ds-nav-toggle" class="nav-toggle" aria-hidden="true">
    <div class="wrap">
      <a href="/de/corporate" class="logo" aria-label="Hirslanden Startseite">
        <img src="https://main--claude-design-eds--paolomoz.aem.page/img/hirslanden/hirslanden-logo.png" alt="Hirslanden" width="188" height="54">
      </a>
      <ul id="ds-nav-list">
        <li><a href="/de/corporate/ueber-uns/kontakt/healthline">Healthline</a></li>
        <li><a href="/de/corporate/kliniken-und-zentren/kliniken">Kliniken</a></li>
        <li><a href="/de/corporate/aerzte">Ärzte</a></li>
        <li><a href="/de/corporate/fachgebiete">Fachgebiete</a></li>
      </ul>
      <a href="/de/corporate/search" class="icon-search" aria-label="Suche">⌕</a>
      <label for="ds-nav-toggle" class="ds-nav-burger" aria-label="Menü">☰</label>
    </div>
  </nav>
</div>
