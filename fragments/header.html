<style>
  /* slicc app top bar — lifted from prototype .top + .brand + .workspace + .iconbtn + .avatar.
     Scoped under header.header (postlcp.js sets the host class to "header"). */
  header.header {
    display: block;
    background: var(--bg-chrome);
    border-bottom: 1px solid var(--border-2);
    box-shadow: 0 1px 0 rgb(0 0 0 / 40%);
  }

  header.header .slicc-top {
    display: flex;
    align-items: center;
    gap: var(--s-4);
    height: var(--top-h);
    padding: 0 var(--s-5);
  }

  header.header .slicc-top__menu {
    width: 28px;
    height: 28px;
    border-radius: var(--r-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
    margin-right: 2px;
    transition: background 120ms, color 120ms;
  }

  header.header .slicc-top__menu:hover { background: rgb(255 255 255 / 5%); color: var(--text); }

  header.header .slicc-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    letter-spacing: -0.008em;
  }

  header.header .slicc-brand:hover { color: var(--text); }

  header.header .slicc-brand__icon {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #c58a4b, #e0244f);
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 18%), 0 1px 2px rgb(0 0 0 / 40%);
  }

  header.header .slicc-brand__icon svg { width: 17px; height: 17px; display: block; }

  header.header .slicc-top__right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: var(--s-1);
  }

  header.header .slicc-workspace {
    margin-right: var(--s-3);
    display: inline-flex;
    align-items: center;
    gap: var(--s-3);
    padding: 4px 10px;
    background: rgb(255 255 255 / 4%);
    border: 1px solid var(--border-2);
    border-radius: var(--r-sm);
    font-size: 12.5px;
    color: var(--text-soft);
    font-weight: 500;
    transition: background 120ms, border-color 120ms;
  }

  header.header .slicc-workspace:hover { background: rgb(255 255 255 / 7%); border-color: var(--border-3); }

  header.header .slicc-workspace__dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 6px rgb(79 201 144 / 40%);
  }

  header.header .slicc-iconbtn {
    width: 30px;
    height: 30px;
    border-radius: var(--r-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    position: relative;
    transition: background 120ms, color 120ms;
  }

  header.header .slicc-iconbtn:hover { background: rgb(255 255 255 / 5%); color: var(--text); }
  header.header .slicc-iconbtn svg { width: 16px; height: 16px; }

  header.header .slicc-iconbtn .slicc-dot {
    position: absolute;
    top: 6px;
    right: 7px;
    width: 7px;
    height: 7px;
    background: var(--pink);
    border-radius: 50%;
    border: 2px solid var(--bg-chrome);
    box-shadow: 0 0 4px rgb(199 60 95 / 50%);
  }

  header.header .slicc-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    margin-left: 6px;
    background: linear-gradient(135deg, #6c6d77, #3a3b44);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    font-weight: 600;
    font-size: 11.5px;
    border: 1px solid var(--border-2);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 12%), 0 1px 2px rgb(0 0 0 / 40%);
  }

  @media (width <= 640px) {
    header.header .slicc-workspace { display: none; }
  }
</style>

<div class="slicc-top">
  <button class="slicc-top__menu" type="button" aria-label="Menu">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h10"/></svg>
  </button>
  <a class="slicc-brand" href="/">
    <span class="slicc-brand__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="2" width="12" height="3" fill="#F0E1B3"/>
        <rect x="5" y="5" width="14" height="3" fill="#FBD3DA"/>
        <rect x="6" y="8" width="12" height="3" fill="#fff" opacity="0.9"/>
        <polygon points="6,11 18,11 12,22" fill="#3a1a08"/>
      </svg>
    </span>
    slicc
  </a>
  <div class="slicc-top__right">
    <div class="slicc-workspace"><span class="slicc-workspace__dot"></span> acme workspace</div>
    <button class="slicc-iconbtn" type="button" aria-label="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
    <button class="slicc-iconbtn" type="button" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="slicc-dot"></span>
    </button>
    <button class="slicc-iconbtn" type="button" aria-label="Apps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <div class="slicc-avatar">P</div>
  </div>
</div>
