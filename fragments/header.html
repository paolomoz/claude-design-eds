<style>
  .header.header { all: revert; }

  .header .ds-nav-wrap {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: var(--nav-outer) var(--nav-outer) 0;
    z-index: 200;
    pointer-events: none;
  }

  .header .ds-nav {
    height: var(--nav-h);
    backdrop-filter: blur(64px);
    background: rgb(255 255 255 / 64%);
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-inline: var(--s-md);
    pointer-events: all;
    transition: box-shadow var(--d-fast) ease, background var(--d-fast) ease;
  }

  .header .ds-nav__left {
    display: flex;
    align-items: center;
    gap: var(--s-lg);
    height: 100%;
    min-width: 0;
  }

  .header .ds-nav__logo { display: flex; align-items: center; flex-shrink: 0; }
  .header .ds-nav__logo svg { width: 67px; height: 16px; }

  .header .ds-nav__slash {
    width: 1px;
    height: 16px;
    background: rgb(0 0 0 / 16%);
    flex-shrink: 0;
    display: none;
  }

  .header .ds-nav__links {
    display: none;
    list-style: none;
    align-items: center;
    height: 100%;
    gap: 0;
    margin: 0;
    padding: 0;
  }

  @media (min-width: 900px) {
    .header .ds-nav__slash { display: block; }
    .header .ds-nav__links { display: flex; }
  }

  .header .ds-nav__links li a {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 12px;
    height: var(--nav-h);
    font-size: var(--t-label);
    font-weight: 700;
    color: var(--c-text-soft);
    white-space: nowrap;
    text-decoration: none;
    transition: color var(--d-fast) ease;
  }

  .header .ds-nav__links li a:hover { color: var(--c-text); }

  .header .ds-nav__links li a[aria-current="page"] {
    color: var(--c-text);
    box-shadow: inset 0 -2px 0 var(--c-text);
  }

  .header .ds-nav__links li a svg { width: 8px; height: 5px; opacity: 0.6; }

  .header .ds-nav__right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .header .ds-nav__icon-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--c-text-soft);
    border-radius: var(--r-sm);
    transition: background var(--d-fast) ease, color var(--d-fast) ease;
  }

  .header .ds-nav__icon-btn:hover { background: rgb(0 0 0 / 6%); color: var(--c-text); }
  .header .ds-nav__icon-btn svg { width: 18px; height: 18px; }

  .header .ds-nav-burger {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    color: var(--c-text);
    border-radius: var(--r-sm);
  }

  .header .ds-nav-burger:hover { background: rgb(0 0 0 / 6%); }
  .header .ds-nav-burger svg { width: 18px; height: 18px; }

  @media (min-width: 900px) {
    .header .ds-nav-burger { display: none; }
  }

  .header .ds-nav__cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    padding-inline: 18px;
    border-radius: var(--r-md);
    font: 700 var(--t-label) / 1.29 var(--f-b);
    border: 1.5px solid transparent;
    white-space: nowrap;
    text-decoration: none;
    transition: background var(--d-fast) ease, border-color var(--d-fast) ease;
  }

  .header .ds-nav__cta--primary { background: var(--c-primary); color: #fff; }
  .header .ds-nav__cta--primary:hover { background: var(--c-primary-hover); }
  .header .ds-nav__cta--outline { background: transparent; color: var(--c-text); border-color: var(--c-text); }
  .header .ds-nav__cta--outline:hover { background: rgb(0 0 0 / 4%); }

  @media (max-width: 640px) {
    .header .ds-nav__cta--primary { display: none; }
    .header .ds-nav { padding-inline: var(--s-sm); }
  }
</style>
