<style>
  header.header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgb(255 255 255 / 96%);
    border-bottom: 1px solid var(--color-line);
  }

  header.header .header-bar {
    display: flex;
    align-items: center;
    gap: var(--spacing-lg);
    height: 64px;
    position: relative;
    max-width: var(--max-width);
    margin-inline: auto;
    padding-inline: var(--spacing-lg);
  }

  header.header .wordmark {
    display: inline-flex;
    align-items: center;
    color: var(--color-fg);
  }

  header.header .wordmark svg { height: 25px; width: auto; }

  header.header .ds-nav {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-left: 12px;
  }

  header.header .ds-nav a {
    font-size: var(--body-sm);
    color: var(--color-fg);
    text-decoration: none;
    font-weight: 425;
    font-variation-settings: 'wght' 425;
  }

  header.header .ds-nav a:hover { color: var(--color-accent); }

  header.header .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: var(--spacing-lg);
  }

  header.header .header-actions .signin {
    font-size: var(--body-sm);
    color: var(--color-muted);
    text-decoration: none;
    font-weight: 425;
    font-variation-settings: 'wght' 425;
  }

  header.header .header-actions .signin:hover { color: var(--color-fg); }

  header.header .gesture {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--label);
    font-weight: 425;
    font-variation-settings: 'wght' 425;
    letter-spacing: 0.08em;
    color: var(--color-accent);
    text-decoration: none;
    white-space: nowrap;
  }

  header.header .gesture .arr { transition: transform var(--dur-state) var(--ease-snap); }
  header.header .gesture:hover { color: var(--color-accent-deep); text-decoration: underline; text-underline-offset: 4px; }
  header.header .gesture:hover .arr { transform: translateX(3px); }

  header.header .btn-primary {
    display: inline-block;
    background: var(--color-accent);
    color: #fff;
    font-size: var(--body-sm);
    font-weight: 425;
    font-variation-settings: 'wght' 425;
    text-decoration: none;
    padding: 9px 18px;
    border-radius: var(--radius-control);
    transition: background var(--dur-state) var(--ease-snap);
  }

  header.header .btn-primary:hover { background: var(--color-accent-deep); }

  header.header .ds-nav-toggle {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  header.header .ds-nav-burger { display: none; }

  /* header collapses at 900px — full nav + dual actions need ~830px */
  @media (max-width: 900px) {
    header.header .header-actions .signin { display: none; }
    header.header .header-actions .gesture { display: none; }

    header.header .ds-nav-burger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 8px 12px;
      font-size: var(--label);
      color: var(--color-fg);
      background: transparent;
      border: 1px solid var(--color-line);
      border-radius: var(--radius-control);
      user-select: none;
    }

    header.header .ds-nav-burger-icon { width: 16px; height: 12px; position: relative; }

    header.header .ds-nav-burger-icon::before,
    header.header .ds-nav-burger-icon::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: currentcolor;
    }

    header.header .ds-nav-burger-icon::before { top: 0; }
    header.header .ds-nav-burger-icon::after { bottom: 0; }

    header.header .ds-nav {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      margin-left: 0;
      padding: var(--spacing-md) var(--spacing-lg);
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-line);
      transform: translateY(-8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        transform var(--dur-state) var(--ease-snap),
        opacity var(--dur-state) var(--ease-snap),
        visibility 0s linear var(--dur-state);
    }

    header.header .ds-nav a { padding: 12px 0; border-bottom: 1px solid var(--color-line); }
    header.header .ds-nav a:last-child { border-bottom: 0; }

    header.header .ds-nav-toggle:checked ~ .ds-nav {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition:
        transform var(--dur-state) var(--ease-snap),
        opacity var(--dur-state) var(--ease-snap),
        visibility 0s;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    header.header .gesture .arr,
    header.header .btn-primary,
    header.header .ds-nav { transition: none; }
  }
</style>
