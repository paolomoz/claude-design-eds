<style>
  .surly-header {
    background: var(--paper);
    border-bottom: 1px solid var(--ink);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .surly-header .inner {
    max-width: var(--max-content);
    margin: 0 auto;
    padding: 24px var(--margin-d);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
  }
  .surly-header .logo {
    font-family: var(--display);
    font-size: 26px;
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .surly-header .logo em {
    font-style: normal;
    color: var(--red);
  }
  .surly-header nav.primary {
    display: flex;
    gap: 32px;
    font-family: var(--body);
    font-size: var(--fs-caption);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .surly-header nav.primary a {
    color: var(--ink);
    text-decoration: none;
    padding: 6px 0;
    border-bottom: 1px solid transparent;
    transition: border-color 120ms ease;
  }
  .surly-header nav.primary a:hover { border-bottom-color: var(--red); }
  .surly-header .cta {
    font-family: var(--body);
    font-size: var(--fs-caption);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 14px 24px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    text-decoration: none;
    transition: all 150ms ease;
    white-space: nowrap;
  }
  .surly-header .cta:hover { background: var(--red); color: #fff; border-color: var(--red); }

  /* CSS-only mobile menu (fragment JS is inert) */
  .surly-header #surly-mnav-toggle { position: absolute; opacity: 0; pointer-events: none; }
  .surly-header .hamburger {
    display: none;
    border: 1px solid var(--ink);
    padding: 10px 14px;
    font-family: var(--body);
    font-size: var(--fs-caption);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  @media (max-width: 900px) {
    .surly-header .inner { padding: 16px var(--margin-m); }
    .surly-header nav.primary,
    .surly-header .cta {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      flex-direction: column;
      gap: 0;
      background: var(--paper);
      border-bottom: 1px solid var(--ink);
    }
    .surly-header nav.primary a {
      padding: 18px var(--margin-m);
      border-bottom: 1px solid var(--ink);
    }
    .surly-header .cta {
      margin: 16px var(--margin-m) 24px;
      text-align: center;
    }
    .surly-header .hamburger { display: inline-block; }
    .surly-header #surly-mnav-toggle:checked ~ nav.primary,
    .surly-header #surly-mnav-toggle:checked ~ .cta { display: flex; }
  }
</style>
<div class="surly-header">
  <div class="inner">
    <input type="checkbox" id="surly-mnav-toggle" aria-hidden="true">
    <a href="/" class="logo" aria-label="Surly Brewing Co. home">SURLY<em>.</em></a>
    <nav class="primary" aria-label="Primary">
      <a href="/beer">Beer</a>
      <a href="/our-story">Our story</a>
      <a href="/find">Find Surly</a>
      <a href="/find">Beer hall</a>
    </nav>
    <a href="/find" class="cta">Visit the hall</a>
    <label for="surly-mnav-toggle" class="hamburger" aria-label="Toggle menu">Menu</label>
  </div>
</div>
