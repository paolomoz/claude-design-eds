<style>
  /* ===== Festool header (static fragment) ===== */
  header.header { display: block; }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--ink);
    color: var(--text-inverse);
  }

  .site-header .header-row {
    display: flex;
    align-items: center;
    gap: 40px;
    height: 76px;
  }

  .site-header .wordmark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.10em;
    color: var(--lime);
    line-height: 1;
    flex-shrink: 0;
  }

  .site-header .main-nav { display: flex; gap: 6px; }
  .site-header .main-nav a {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-inverse);
    padding: 10px 14px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .site-header .main-nav a:hover,
  .site-header .main-nav a[aria-current="page"] {
    color: var(--lime);
    border-bottom-color: var(--lime);
  }

  .site-header .header-search {
    flex: 1;
    max-width: 360px;
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgb(255 255 255 / 8%);
    border: 1px solid rgb(255 255 255 / 14%);
    padding: 9px 14px;
    color: var(--text-inverse-dim);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .site-header .header-search:focus-within { border-color: var(--lime); background: rgb(255 255 255 / 12%); }
  .site-header .header-search input {
    flex: 1;
    background: none;
    border: 0;
    outline: 0;
    color: var(--text-inverse);
    font-family: var(--font-body);
    font-size: 15px;
  }
  .site-header .header-search input::placeholder { color: var(--text-inverse-dim); }

  .site-header .header-account {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-inverse);
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .site-header .header-account:hover { color: var(--lime); }

  @media (max-width: 900px) {
    .site-header .header-search { display: none; }
    .site-header .header-row { gap: 22px; height: 66px; flex-wrap: wrap; }
  }
  @media (max-width: 600px) {
    .site-header .main-nav { display: none; }
    .site-header .header-account { margin-left: auto; }
  }
</style>

<div class="site-header">
  <div class="wrap header-row">
    <a class="wordmark" href="/">FESTOOL</a>
    <nav class="main-nav">
      <a href="#" aria-current="page">Tools</a>
      <a href="#">Accessories</a>
      <a href="#">Applications</a>
      <a href="#">Service</a>
    </nav>
    <label class="header-search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.6" /><path d="M11 11 L15 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
      <input type="text" placeholder="Search tools, accessories, article no." aria-label="Search" />
    </label>
    <a class="header-account" href="#">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="6" r="3.2" stroke="currentColor" stroke-width="1.6" /><path d="M2.8 15.5c1.2-2.8 3.5-4.2 6.2-4.2s5 1.4 6.2 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
      MyFestool
    </a>
  </div>
</div>
