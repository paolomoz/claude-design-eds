<style>
  /* Fréscopa chrome — promo bar + site header. Lifted verbatim from the
     prototype. Injected into <header class="header"> by postlcp.js. Nav links
     are decorative spans (the prototype is a single quiz page); rendered
     CSS-only — no fragment JS runs. */
  header.header { display: block; }

  .promo-bar {
    background: var(--red-bar);
    color: #fbefe9;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 8px 40px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: var(--font-body);
  }

  .promo-link { cursor: pointer; }

  .site-header {
    background: #fff;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 14px 40px;
  }

  .site-header .brand { display: flex; align-items: center; gap: 12px; }
  .site-header .brand-rule { width: 1px; height: 24px; background: var(--line); display: inline-block; }

  .site-header .brand-name {
    font-family: var(--font-display);
    font-size: 23px;
    color: var(--maroon);
    letter-spacing: 0.02em;
  }

  .site-header .site-nav { display: flex; gap: 26px; flex: 1; }
  .site-header .header-actions { display: flex; gap: 18px; }

  .site-header .nav-link {
    font-family: var(--font-body);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    padding-bottom: 2px;
    border-bottom: 2px solid transparent;
    transition: border-color 0.15s, color 0.15s;
  }

  .site-header .nav-link:hover {
    color: var(--maroon);
    border-bottom-color: var(--accent);
  }

  @media (max-width: 900px) {
    .promo-bar { padding: 8px 20px; }
    .site-header { padding: 14px 20px; gap: 20px; }
    .site-header .site-nav { display: none; }
  }
</style>

<div class="promo-bar">
  <span>Free shipping from $35 &amp; free coffee samples with code FRESCOPA.</span>
  <span class="promo-link">Shop now</span>
</div>
<div class="site-header">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M24 40C12 34 6 26 6 18c0-10 12-13 18-5 6-8 18-5 18 5 0 8-6 16-18 22z" stroke="#C99B4A" stroke-width="3" stroke-linejoin="round" />
      <path d="M16 17c4-1 8 1 8 6" stroke="#C99B4A" stroke-width="3" stroke-linecap="round" />
    </svg>
    <span class="brand-rule"></span>
    <span class="brand-name">Fr&eacute;scopa</span>
  </div>
  <nav class="site-nav">
    <span class="nav-link">Coffee</span>
    <span class="nav-link">Tea</span>
    <span class="nav-link">Machines</span>
    <span class="nav-link">Accessories</span>
    <span class="nav-link">Locations</span>
    <span class="nav-link">Sustainability</span>
  </nav>
  <div class="header-actions"><span class="nav-link">Sign in</span></div>
</div>
