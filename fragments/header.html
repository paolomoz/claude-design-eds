<style>
  /* Story Half Told (Pfizer) header — floating nav + overlay.
     Fragment JS is inert, so the open/close is a CSS checkbox-hack. */
  header.header {
    position: relative;
    z-index: 100;
  }

  .sht-skip {
    position: absolute;
    left: -9999px;
    top: var(--spacing-md, 16px);
    background: var(--color-accent, #5b2eb4);
    color: #fff;
    padding: 12px 16px;
    text-decoration: none;
    z-index: 200;
    border-radius: var(--radius, 12px);
  }

  .sht-skip:focus {
    left: var(--spacing-md, 16px);
  }

  .sht-nav-toggle {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }

  .sht-brand {
    position: fixed;
    top: 18px;
    left: var(--spacing-lg, 24px);
    z-index: 100;
    display: inline-flex;
    align-items: center;
  }

  .sht-brand img {
    height: 40px;
    width: auto;
  }

  .sht-nav-burger {
    position: fixed;
    top: var(--spacing-lg, 24px);
    right: var(--spacing-lg, 24px);
    width: 48px;
    height: 48px;
    border-radius: var(--radius-pill, 9999px);
    background: var(--color-accent, #5b2eb4);
    color: #fff;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: pointer;
    transition: background var(--dur-fast, 120ms) var(--ease-out, ease);
  }

  .sht-nav-burger:hover {
    background: var(--color-accent-dark, #4a24a0);
  }

  .sht-nav-overlay {
    position: fixed;
    inset: 0;
    background: rgb(91 46 180 / 97%);
    color: #fff;
    z-index: 99;
    display: none;
    align-items: center;
    justify-content: center;
    padding: var(--spacing-2xl, 64px) var(--spacing-lg, 24px);
  }

  .sht-nav-toggle:checked ~ .sht-nav-overlay {
    display: flex;
  }

  .sht-nav-toggle:checked ~ .sht-brand,
  .sht-nav-toggle:checked ~ .sht-nav-burger {
    display: none;
  }

  .sht-nav-overlay ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg, 24px);
    text-align: center;
  }

  .sht-nav-overlay a {
    display: inline-block;
    color: #fff;
    text-decoration: none;
    font-family: var(--heading-font-family, sans-serif);
    font-size: var(--heading-xl, 2rem);
    font-weight: 400;
    line-height: 1.1;
    padding: var(--spacing-xs, 8px) var(--spacing-md, 16px);
    transition: opacity var(--dur-fast, 120ms) var(--ease-out, ease);
  }

  .sht-nav-overlay a:hover {
    opacity: 0.75;
  }

  .sht-nav-overlay a strong {
    font-weight: 700;
    color: #fff;
  }

  .sht-nav-close {
    position: absolute;
    top: var(--spacing-lg, 24px);
    right: var(--spacing-lg, 24px);
    width: 48px;
    height: 48px;
    border-radius: var(--radius-pill, 9999px);
    background: rgb(255 255 255 / 18%);
    color: #fff;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  @media (width <= 640px) {
    .sht-brand,
    .sht-nav-burger {
      top: var(--spacing-md, 16px);
    }

    .sht-brand {
      left: var(--spacing-md, 16px);
    }

    .sht-nav-burger {
      right: var(--spacing-md, 16px);
    }

    .sht-nav-overlay a {
      font-size: 1.5rem;
    }
  }
</style>

<a href="#main" class="sht-skip">Skip to main content</a>

<input type="checkbox" id="sht-nav-toggle" class="sht-nav-toggle" aria-label="Toggle navigation menu">

<a href="/" class="sht-brand" aria-label="Story Half Told — home">
  <img src="https://main--claude-design-eds--paolomoz.aem.page/img/pfizer/logo.png" alt="Breast Cancer: A Story Half Told" width="160" height="40">
</a>

<label for="sht-nav-toggle" class="sht-nav-burger" aria-label="Open navigation menu">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <line x1="4" y1="7" x2="20" y2="7"></line>
    <line x1="4" y1="12" x2="20" y2="12"></line>
    <line x1="4" y1="17" x2="20" y2="17"></line>
  </svg>
</label>

<div class="sht-nav-overlay">
  <label for="sht-nav-toggle" class="sht-nav-close" aria-label="Close navigation menu">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="6" y1="6" x2="18" y2="18"></line>
      <line x1="18" y1="6" x2="6" y2="18"></line>
    </svg>
  </label>
  <nav aria-label="Primary">
    <ul>
      <li><a href="/about">About</a></li>
      <li><a href="/community-stories">Community <strong>Stories</strong></a></li>
      <li><a href="/share-your-story"><strong>Share</strong> Your Story</a></li>
      <li><a href="/resources">Resources</a></li>
    </ul>
  </nav>
</div>
