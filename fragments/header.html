<style>
  header.header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: block;
    background: rgb(255 255 255 / 92%);
    backdrop-filter: saturate(1.4) blur(6px);
    border-bottom: 1px solid var(--color-mist);
  }

  header.header .nav-row {
    display: flex;
    align-items: center;
    gap: var(--spacing-lg);
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 14px var(--spacing-lg);
    position: relative;
  }

  header.header .wordmark {
    display: flex;
    align-items: center;
  }

  header.header .wordmark svg {
    height: 26px;
    width: auto;
  }

  header.header .ds-nav {
    display: flex;
    align-items: center;
    gap: var(--spacing-lg);
    flex: 1;
  }

  header.header .ds-nav a {
    color: var(--color-fg);
    text-decoration: none;
    font-size: 15px;
    transition: color 0.3s var(--ease-micro);
  }

  header.header .ds-nav a:hover {
    color: var(--color-accent);
  }

  header.header .nav-actions {
    display: flex;
    align-items: center;
    gap: var(--spacing-md);
    margin-left: auto;
  }

  header.header .nav-actions .signin {
    color: var(--color-fg);
    text-decoration: none;
    font-size: 15px;
    transition: color 0.3s var(--ease-micro);
  }

  header.header .nav-actions .signin:hover {
    color: var(--color-accent);
  }

  header.header .nav-actions .nav-btn {
    display: inline-flex;
    align-items: center;
    background: var(--color-accent);
    color: #fff;
    text-decoration: none;
    border-radius: var(--radius-sm);
    padding: 9px 18px;
    font-size: 14px;
    transition: background-color 0.3s var(--ease-micro);
  }

  header.header .nav-actions .nav-btn:hover {
    background: var(--color-accent-deep);
  }

  header.header .ds-nav-toggle {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  header.header .ds-nav-burger {
    display: none;
  }

  @media (max-width: 640px) {
    header.header .ds-nav-burger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 9px 13px;
      font-size: var(--body-sm);
      color: var(--color-fg);
      background: transparent;
      border: 1px solid var(--color-mist);
      border-radius: var(--radius-sm);
      user-select: none;
      margin-left: auto;
    }

    header.header .ds-nav-burger-icon {
      width: 16px;
      height: 12px;
      position: relative;
    }

    header.header .ds-nav-burger-icon::before,
    header.header .ds-nav-burger-icon::after,
    header.header .ds-nav-burger-icon span {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: currentcolor;
    }

    header.header .ds-nav-burger-icon::before { top: 0; }
    header.header .ds-nav-burger-icon span { top: 5px; }
    header.header .ds-nav-burger-icon::after { bottom: 0; }

    header.header .ds-nav {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-mist);
      flex-direction: column;
      align-items: stretch;
      padding: var(--spacing-md) var(--spacing-lg) var(--spacing-lg);
      gap: 0;
    }

    header.header .ds-nav a {
      padding: 12px 0;
      border-bottom: 1px solid var(--color-mist);
      font-size: var(--body);
    }

    header.header .ds-nav-toggle:checked ~ .ds-nav {
      display: flex;
    }

    header.header .nav-actions .signin {
      display: none;
    }
  }
</style>
