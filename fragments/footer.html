<style>
  /* ===== Beehive footer (static fragment) ===== */
  footer.footer {
    display: block;
    position: relative;
    background: var(--accent);
    color: var(--ink);
    padding: clamp(56px, 7vw, 96px) clamp(20px, 5vw, 64px) 40px;
    overflow: hidden;
  }

  footer .f-top {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 40px;
    align-items: start;
    max-width: var(--maxw);
    margin: 0 auto;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 44px;
  }
  footer .f-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 14px; }
  footer .f-lead { margin: 0 0 20px; font-size: 16px; max-width: 380px; line-height: 1.55; }

  footer .f-form { display: flex; gap: 10px; max-width: 420px; flex-wrap: wrap; }
  footer .f-form input {
    flex: 1;
    min-width: 200px;
    background: rgb(11 11 11 / 6%);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 14px 20px;
    font-size: 15px;
    color: var(--ink);
    outline: none;
  }
  footer .f-form button {
    background: var(--ink);
    color: var(--accent);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 14px 26px;
    border: none;
    border-radius: 999px;
    transition: transform 0.2s ease;
  }
  footer .f-form button:hover { transform: translateY(-2px); }

  footer .f-links { display: flex; gap: 60px; flex-wrap: wrap; }
  footer .f-col { display: flex; flex-direction: column; gap: 12px; }
  footer .f-col .h { font-size: 12px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.55; margin-bottom: 4px; }
  footer .f-col a { font-weight: 700; font-size: 15px; transition: opacity 0.2s ease; }
  footer .f-col a:hover { opacity: 0.6; }

  footer .f-bottom { position: relative; z-index: 2; max-width: var(--maxw); margin: 0 auto; }
  footer .f-wordmark {
    font-family: var(--font-display);
    font-size: clamp(60px, 18vw, 260px);
    line-height: 0.82;
    letter-spacing: -0.01em;
    margin: 30px 0 18px;
    white-space: nowrap;
  }
  footer .f-legal {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
  }
  footer .f-legal .muted { opacity: 0.7; }

  @media (max-width: 720px) {
    footer .f-top { grid-template-columns: 1fr; }
  }
</style>

<div class="f-top">
  <div>
    <div class="f-eyebrow">Join the swarm</div>
    <p class="f-lead">New pours, tap takeovers, and taproom nights — straight to your inbox. No spam, just beer.</p>
    <div class="f-form">
      <input type="email" placeholder="you@email.com" aria-label="Email address" />
      <button type="button">Subscribe</button>
    </div>
  </div>
  <div class="f-links">
    <div class="f-col">
      <div class="h">Visit</div>
      <a href="#lineup">Beers</a>
      <a href="#taproom">Taproom</a>
      <a href="#story">Our Story</a>
    </div>
    <div class="f-col">
      <div class="h">Follow</div>
      <a href="#">Instagram</a>
      <a href="#">Untappd</a>
      <a href="#">Newsletter</a>
    </div>
  </div>
</div>
<div class="f-bottom">
  <div class="f-wordmark">BEEHIVE</div>
  <div class="f-legal">
    <span>© 2026 Beehive Brewing Co. · Salt Lake City, Utah</span>
    <span class="muted">Please drink responsibly. Must be 21+.</span>
  </div>
</div>
